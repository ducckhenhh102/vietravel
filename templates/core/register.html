{% extends 'base.html' %}
{% block title %}Đăng ký tài khoản — VietTravel{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-logo"><i class="fas fa-plane-departure"></i> VietTravel</div>
    <h2>Tạo tài khoản mới</h2>
    <p>Đăng ký để đặt tour và quản lý chuyến đi của bạn</p>
    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Họ và tên *</label>
        <div class="input-icon-wrap"><i class="fas fa-user"></i><input type="text" name="full_name" placeholder="Nguyễn Văn An" required/></div>
      </div>
      <div class="form-group">
        <label>Tên đăng nhập *</label>
        <div class="input-icon-wrap"><i class="fas fa-at"></i><input type="text" name="username" placeholder="username" required/></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-icon-wrap"><i class="fas fa-envelope"></i><input type="email" name="email" placeholder="email@example.com"/></div>
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <div class="input-icon-wrap"><i class="fas fa-phone"></i><input type="text" name="phone" placeholder="0912 345 678"/></div>
      </div>
      <div class="form-group">
        <label>Mật khẩu *</label>
        <div class="input-icon-wrap"><i class="fas fa-lock"></i><input type="password" name="password" placeholder="••••••••" required/></div>
      </div>
      <button type="submit" class="btn-auth">Đăng ký ngay <i class="fas fa-arrow-right"></i></button>
      <div class="auth-switch">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></div>
    </form>
  </div>
</section>
{% endblock %}
