version: '3.9'

services:

  # ── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: travel_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       travel_erp
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Django / Wagtail Application ─────────────────────────
  web:
    build: .
    container_name: travel_erp_web
    restart: unless-stopped
    environment:
      SECRET_KEY:   django-secret-key-change-me-in-prod
      DEBUG:        "True"
      DB_NAME:      travel_erp
      DB_USER:      postgres
      DB_PASSWORD:  postgres123
      DB_HOST:      db
      DB_PORT:      "5432"
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Apache Superset BI Dashboard ─────────────────────────
  superset:
    image: apache/superset:latest
    container_name: travel_superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY:  superset-secret-key-change-in-prod
      ADMIN_USERNAME:       admin
      ADMIN_FIRSTNAME:      Admin
      ADMIN_LASTNAME:       Superset
      ADMIN_EMAIL:          admin@superset.vn
      ADMIN_PASSWORD:       admin123
    ports:
      - "8088:8088"
    depends_on:
      - db
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname Superset
          --email admin@superset.vn
          --password admin123 2>/dev/null || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload
      "

volumes:
  postgres_data:
  static_files:
  media_files:
